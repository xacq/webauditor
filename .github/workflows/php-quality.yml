name: PHP quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, intl
      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run security regression checks
        run: |
          for test in tests/*.php; do
            php "$test"
          done
      - name: Validate JavaScript localization runtime
        run: |
          node tests/i18n-runtime.js
          node tests/pdf-report.js
