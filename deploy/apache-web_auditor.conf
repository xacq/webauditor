# Requiere Apache 2.4 con mod_headers y mod_ssl.
# Activa antes los módulos: a2enmod headers ssl reqtimeout remoteip
# Si usas Cloudflare, configura RemoteIPTrustedProxy con sus rangos oficiales
# antes de habilitar mod_remoteip. No confíes en X-Forwarded-For sin ello.

<VirtualHost *:80>
    ServerName auditor.example.com
    DocumentRoot /var/www/web_auditor

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName auditor.example.com
    DocumentRoot /var/www/web_auditor

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/auditor.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/auditor.example.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off

    Options -Indexes
    AllowOverride None
    TraceEnable off

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    <Directory "/var/www/web_auditor/lib">
        Require all denied
    </Directory>
    <FilesMatch "(^\.env|^\.git|\.(bak|old|sql|dist|log)$)">
        Require all denied
    </FilesMatch>
    <Files "api.php">
        <LimitExcept POST>
            Require all denied
        </LimitExcept>
    </Files>

    RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
    LimitRequestBody 4096

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/web_auditor_error.log
    CustomLog ${APACHE_LOG_DIR}/web_auditor_access.log combined
</VirtualHost>
